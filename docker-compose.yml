services:
  postgres:
    image: postgres:16-alpine
    container_name: dfs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfs}
      POSTGRES_USER: ${POSTGRES_USER:-dfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dfs_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfs} -d ${POSTGRES_DB:-dfs}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: dfs-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dfs}
      DB_USERNAME: ${POSTGRES_USER:-dfs}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dfs_password}
      STORAGE_ROOT: /app/storage
      CHUNK_SIZE_BYTES: ${CHUNK_SIZE_BYTES:-1048576}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-200MB}
    volumes:
      # Chunk files persist on the host in ./storage/node1, node2, node3
      - ./storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dfs-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  pgdata:
